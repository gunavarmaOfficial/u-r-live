<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark, html.dark body {
        background-color: #07060d;
        color: #f6f5ff;
      }
      html.light, html.light body {
        background-color: #f8f7ff;
        color: #111827;
      }
    </style>
    <!--app-head-->
    <title>U-R-LIVE — Live Random Video Chat for Adults (18+)</title>
    <meta
      name="description"
      content="Meet someone new face to face. U-R-LIVE is an 18+ live random video chat with instant server-side matching, encrypted peer-to-peer video and zero recordings."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://u-r-live.com/" />
    <!--/app-head-->
  </head>
  <body class="bg-[#f8f7ff] dark:bg-[#07060d] text-neutral-900 dark:text-neutral-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
