# Render Blueprint — one-click deploy of the full U-R-LIVE stack
# (Express API + WebSocket matchmaker + prerendered frontend + Postgres).
#
# How to deploy:
#   1. Push this file to your repo (Render > New > Blueprint, pick the repo).
#   2. Render creates the web service + Postgres and runs migrations on deploy.
#   3. Use the Render URL (https://u-r-live.onrender.com) — everything works
#      there: pages, API and live video matching.
#
# NOTE: services below default to the free tier (web sleeps after ~15 min idle,
# free Postgres expires after 30 days). For production, switch the web service
# to Starter (~$7/mo) and the database to Starter (~$12/mo) in the Render
# dashboard, or set `plan: starter` on both resources below.

services:
  - type: web
    name: u-r-live
    runtime: node
    buildCommand: npm ci && npm run build:full
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: u-r-live-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # Public origin of this service. Render injects RENDER_EXTERNAL_URL at
      # runtime and the server falls back to it, so this can stay empty.
      # Set it to your custom domain (https://u-r-live.com) when you add one.
      - key: PUBLIC_URL
        sync: false
        value: ""
      # Baked into the prerendered HTML (canonicals, sitemap, JSON-LD).
      # Update to your final domain and redeploy when you have one.
      - key: VITE_SITE_URL
        sync: false
        value: https://u-r-live.onrender.com
      - key: LEGAL_TERMS_VERSION
        value: "2026-10-28"
      # Only needed if you keep the static frontend on another origin (e.g.
      # Vercel) and set VITE_API_URL there. Comma-separated origins.
      - key: CORS_ORIGINS
        sync: false
        value: ""

databases:
  - name: u-r-live-db
    databaseName: u_r_live
    user: u_r_live
